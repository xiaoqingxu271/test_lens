name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Build and inspect wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("testlens-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              entry_points = next(
                  name for name in names if name.endswith("entry_points.txt")
              )
              text = archive.read(entry_points).decode("utf-8")
          required = {
              "sandbox/Dockerfile",
              "evaluation/fixtures/fastapi_project/app.py",
              "evaluation/fixtures/fastapi_project/labels.json",
              "evaluation/fixtures/fastapi_project/proposals.json",
              "evaluation/fixtures/flask_project/app.py",
              "evaluation/fixtures/flask_project/labels.json",
              "evaluation/fixtures/flask_project/proposals.json",
          }
          missing = required - names
          assert not missing, f"wheel is missing package data: {sorted(missing)}"
          assert "testlens = cli.main:main" in text, text
          print(f"wheel contents verified: {wheel}")
          PY
      - name: Evaluation baseline
        run: python -m evaluation
      - name: Verify Linux enforced baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("eval/reports").glob("*/report.json"))
          assert reports, "evaluation wrote no report"
          trace = json.loads(reports[-1].read_text(encoding="utf-8"))["trace"]
          assert trace["platform"] == "Linux", trace["platform"]
          assert trace["enforcement_mode"] == "enforced", trace["enforcement_mode"]
          assert trace["sandbox_backend"] == "subprocess", trace["sandbox_backend"]
          assert trace["double_run"] is True, trace["double_run"]
          assert trace["model_kind"] == "fake", trace["model_kind"]
          print(f"linux enforced baseline verified: {reports[-1]}")
          PY

  container:
    name: container backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build sandbox image
        run: docker build -t testlens-sandbox:1 sandbox
      - name: Container tests
        env:
          TESTLENS_CONTAINER_IMAGE: testlens-sandbox:1
        run: python -m pytest -m container
      - name: Container evaluation baseline
        run: >-
          python -m evaluation
          --sandbox-backend container
          --sandbox-image testlens-sandbox:1
      - name: Verify container baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reports = sorted(Path("eval/reports").glob("*/report.json"))
          assert reports, "evaluation wrote no report"
          trace = json.loads(reports[-1].read_text(encoding="utf-8"))["trace"]
          assert trace["sandbox_backend"] == "container", trace["sandbox_backend"]
          assert trace["platform"] == "Linux", trace["platform"]
          assert trace["enforcement_mode"] == "enforced", trace["enforcement_mode"]
          assert trace["double_run"] is True, trace["double_run"]
          print(f"container enforced baseline verified: {reports[-1]}")
          PY
